<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<link rel="icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nimbus">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Nimbus</title>
<script src="/passkeys.js" type="module"></script>
<script src="/pwa.js" type="module"></script>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/mobile.css">
<style>
body { display: grid; place-items: center; min-height: 100dvh; padding: 16px; }
.box { width: min(360px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px; background: var(--side); display: flex; flex-direction: column; gap: 16px; }
.box h1 { margin: 0; font-size: 22px; font-weight: 650; display: flex; align-items: center; gap: 10px; }
.err { color: var(--bad); font-size: 14px; min-height: 18px; }
.or { text-align: center; font-size: 13px; opacity: .6; }
[hidden] { display: none !important; }
.hint-text { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
.linkish { color: var(--muted); font-size: 13px; }
#code { letter-spacing: .2em; font-size: 18px; text-align: center; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.tabs { width: 100%; }
.tabs button { flex: 1; }
</style>
</head>
<body>
<form class="box" id="f" data-nimbus-login>
  <img src="/nimbus.webp" alt="Nimbus" width="200" height="200" style="align-self:center;width:200px;height:200px;border-radius:14px;image-rendering:pixelated">
  <div><h1>Sign in to Nimbus</h1><p class="hint-text" id="signin-help">Loading sign-in methods…</p></div>
  <div id="origin-notice" class="stack" hidden><p class="hint-text">Passkeys work at the Nimbus sign-in address. Open it to continue:</p><a class="linkish" id="origin-link" hidden></a></div>
  <div id="userbox" hidden class="stack">
    <label class="field">Username<input id="username" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label class="field">Password<input id="upw" type="password" autocomplete="current-password"></label>
    <button class="btn dark big" type="submit">Continue</button>
  </div>
  <div id="acct" hidden class="stack">
    <div class="seg tabs" role="tablist"><button type="button" data-mode="signin" aria-pressed="true">Sign in</button><button type="button" data-mode="signup" aria-pressed="false">Create account</button></div>
    <label class="field">Email<input id="email" type="email" autocomplete="email"></label>
    <label class="field">Password<input id="apw" type="password" autocomplete="current-password" minlength="8"></label>
    <label class="field" id="confirm-wrap" hidden>Confirm password<input id="apw2" type="password" autocomplete="new-password"></label>
    <button class="btn dark big" id="acct-go">Sign in</button>
  </div>
  <div id="pwbox" hidden class="stack">
    <label class="field">Password<input id="pw" type="password" autocomplete="current-password"></label>
    <button class="btn dark big">Log in</button>
  </div>
  <div id="mfabox" hidden class="stack">
    <div><b>Two-factor code</b><div class="hint-text">Open your authenticator app and enter the 6-digit code for Nimbus. Lost your phone? Enter a recovery code instead.</div></div>
    <label class="field">Code<input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"></label>
    <button class="btn dark big">Verify</button>
    <button type="button" class="linkish" id="mfa-back">Back</button>
  </div>
  <div id="passkeybox" hidden class="stack">
    <div><b id="passkey-title">Verify your Nimbus passkey</b><div class="hint-text" id="passkey-help"></div></div>
    <label class="field" id="passkey-label-wrap" hidden>Passkey name (optional)<input id="passkey-label" maxlength="80" autocomplete="off" placeholder="For example, my phone"></label>
    <button class="btn dark big" type="button" id="passkey-go">Verify passkey</button>
    <button class="linkish" type="button" id="passkey-restart">Restart sign-in</button>
  </div>
  <div class="err" id="err" role="alert"></div>
</form>
</body>
</html>
